# Install through the server's normal Git-managed configuration process.
# HTTPS certificates and DNS are environment-specific and must be provisioned first.
server {
    listen 80;
    server_name bill.wonglao.com;
    return 308 https://bill.wonglao.com$request_uri;
}
server {
    listen 443 ssl;
    server_name bill.wonglao.com;
    ssl_certificate /etc/letsencrypt/live/bill.wonglao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bill.wonglao.com/privkey.pem;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
